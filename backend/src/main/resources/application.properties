# アプリの設定ファイル
# Spring Boot は起動するときにこのファイルを読み込む。
# 開発中だけ使う設定は application-dev.properties に書く（./gradlew bootRun のときに読み込まれる）。

# アプリの名前（ログなどに表示される）
spring.application.name=taskmanagement

# ---- DB（PostgreSQL）の接続先 ----
# compose.yaml で起動した PostgreSQL につなぐ。値は compose.yaml の environment と合わせる
# ※ ローカル開発専用の値
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagement
spring.datasource.username=taskmanagement
spring.datasource.password=taskmanagement

# ---- テーブルの管理 ----
# テーブルは Flyway が src/main/resources/db/migration の SQL ファイルで作る。
# Hibernate はテーブルを作らず、Entity（Task クラス）とテーブルの定義が合っているかを起動時に確かめるだけにする（validate）。
# 合っていなければ起動に失敗するので、Entity だけ変えて SQL を書き忘れたことに気づける
spring.jpa.hibernate.ddl-auto=validate

# ---- JPA（Hibernate）の設定 ----
# リクエストの処理が終わる（レスポンスを返し終わる）まで DB とのやり取りを開いたままにする機能を切る。
# 開いたままだと、気づかないところで SQL が実行されることがあるため（初期設定のままだと起動時に警告も出る）
spring.jpa.open-in-view=false
# 日時を DB とやり取りするときのタイムゾーンを UTC に固定する（PC のタイムゾーンによって保存される値が変わらないように）
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
