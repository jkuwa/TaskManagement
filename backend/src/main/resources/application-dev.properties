# 開発用の設定（./gradlew bootRun で起動したときだけ読み込まれる。build.gradle の bootRun を参照）
# application.properties の設定に、ここに書いた設定が上書き・追加される。

# Hibernate が実行した SQL をログに出す（学習・確認用）
logging.level.org.hibernate.SQL=debug

# Flyway を入れる前から使っている開発用 DB には、すでに tasks テーブルがあり、
# Flyway の記録（flyway_schema_history）がないので、そのままだと起動に失敗する。
# 記録がなければ「V1 までは実行済み」として記録を作り、V2 から実行する（V1 は Hibernate が作ったテーブルと同じ定義）
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
