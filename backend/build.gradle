// ビルド設定ファイル
// 「どの Java で動かすか」「どのライブラリを使うか」など、ビルドに必要な設定をまとめたもの。
// ./gradlew test や ./gradlew bootRun を実行すると、Gradle がこのファイルを読んで処理する。

// 使う Gradle のプラグイン（Gradle に機能を追加する部品）
plugins {
	id 'java' // Java のソースコードをコンパイルできるようにする
	id 'org.springframework.boot' version '4.1.2' // Spring Boot 用の機能（bootRun などのタスク）を追加する
	id 'io.spring.dependency-management' version '1.1.7' // Spring Boot に合うライブラリのバージョンを自動で決めてくれる
	id 'checkstyle' // コードの書き方をチェックする（Checkstyle。Gradle に最初から入っている）
	id 'com.github.spotbugs' version '6.5.13' // バグになりやすいコードを見つける（SpotBugs）
}

// このプロジェクトの識別情報（ライブラリとして公開する場合の名前とバージョン）
group = 'io.github.jkuwa'  // パッケージ名とは別だが、揃えるのが一般的
version = '0.0.1-SNAPSHOT' // SNAPSHOT は「開発中」という意味

// 使う Java のバージョン
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ライブラリをダウンロードする場所（Maven Central は Java のライブラリが集まっている公式の置き場）
repositories {
	mavenCentral()
}

// 使うライブラリの一覧
// バージョンを書いていないものは、dependency-management プラグインが Spring Boot に合うものを選ぶ
dependencies {
	// Web API を作るためのライブラリ（Spring MVC と、サーバーの Tomcat が含まれる）
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// DB を Java のクラスとして扱うためのライブラリ（Spring Data JPA と、その中身の Hibernate が含まれる）
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// PostgreSQL に接続するためのドライバー。アプリを動かすときだけ必要なので runtimeOnly にする
	runtimeOnly 'org.postgresql:postgresql'
	// テストを書くためのライブラリ（JUnit、MockMvc などが含まれる）
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Testcontainers：テストのときに Docker で PostgreSQL を自動で起動して使えるようにする
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// テストを実行するときだけ必要な、JUnit の実行用ライブラリ
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ./gradlew test を実行したときに、JUnit 5 でテストを動かす設定
// テストコードが JUnit 5 の記法で書かれている場合、これがないとJUnit 4 のやり方でテストを探してしまうため、テストコードが動かない
tasks.named('test') {
	useJUnitPlatform()
}

// ---- 静的解析（コードを動かさずにチェックする）----
// フロントエンドの lint（oxlint）にあたるもの。./gradlew check を実行すると、テストと一緒に動く。
// 1件でも指摘があれば失敗する。結果は build/reports/checkstyle と build/reports/spotbugs に HTML で出る。

// Checkstyle：コードの書き方（import・名前の付け方・{ } の付け忘れなど）をチェックする
// ルールは config/checkstyle/checkstyle.xml（Gradle が自動でこの場所を読む）
checkstyle {
	toolVersion = '14.4.0'
	maxWarnings = 0 // 警告も1件でもあれば失敗にする
}

// SpotBugs：コンパイルしたクラスを調べて、バグになりやすい書き方（null の扱い、equals の間違いなど）を見つける
spotbugs {
	toolVersion = '4.10.5'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX') // できるだけ詳しく調べる
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM') // 「確からしさ」が中以上の指摘だけを出す
	excludeFilter = file('config/spotbugs/exclude.xml') // 誤検知として除外するもの
}

// SpotBugs の結果を HTML で出す（ブラウザで開いて読めるように）
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
		}
	}
}
